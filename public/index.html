<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Favicon: sin esto el navegador muestra el ícono genérico en la pestaña -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <!-- PWA: sin este link el navegador no reconoce manifest.json aunque exista en /public -->
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA iOS: sin esto, "Agregar a inicio" en Safari usa una captura de pantalla en vez del ícono.
         180x180 es el tamaño que recomienda Apple -- iOS no lee manifest.json para esto. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* `100%`/`100vh` en mobile Safari/Chrome usan el alto "grande" del
           viewport (sin la barra de direcciones), no el visible en ese
           momento -- eso empujaba la tab bar y otros elementos de fondo
           fuera de la pantalla real. `100dvh` sigue el viewport visible de
           verdad; los navegadores que no lo soportan ignoran esta línea y
           se quedan con el `height: 100%` de arriba. */
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
